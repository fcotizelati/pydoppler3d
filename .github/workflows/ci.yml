name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          - python: "3.14"
            os: macos-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install all supported extras
        run: python -m pip install -e ".[dev]"
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test including plots, FITS, and covariance
        run: python -m pytest --cov=pydoppler3d --cov-report=term-missing --cov-report=xml --cov-fail-under=75 -q

      - name: Retain coverage evidence
        if: always() && matrix.python == '3.14' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: python -m pip install "numpy==1.23.0" "scipy==1.9.0" pytest pytest-cov
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --sdist --wheel
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions
          path: dist/*
      - run: python -m pip install dist/*.whl
      - name: Exercise installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import pydoppler3d as p
          import numpy as np
          assert 'site-packages' in p.__file__, p.__file__
          p.copy_test_data('wheel-data')
          spectra = p.load_v834cen_dataset('wheel-data/v834cen').spectra
          assert spectra.covariance.shape == (59, 73, 73)
          g = p.VelocityGrid3D.regular(nxy=3, nz=3)
          r = p.mem_reconstruct(spectra.flux, g, spectra.phases, spectra.velocity,
                               error=spectra.error, covariance=spectra.covariance,
                               inclination_deg=50, config=p.MemConfig(iterations=1))
          assert np.isfinite(r.image).all()
          assert r.status != 'not_assessed'
          p.DopplerMap(r.image, g, r.diagnostics()).to_npz('wheel-map.npz')
          assert Path('wheel-map.npz').is_file()
          PY
          pydoppler3d-info
